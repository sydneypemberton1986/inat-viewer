<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locked iNaturalist Grid Viewer</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link rel="stylesheet" href="shared.css">
    <style>
        #ui-container { min-width: 200px; }
        /* Live-location marker drawn as a Leaflet divIcon. */
        .me-dot {
            width: 16px; height: 16px; background: #1a73e8;
            border: 3px solid #fff; border-radius: 50%;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="control-group page-nav">
            <span><a href="index.html">Home</a> &middot; <a href="missed.html">Missed</a> &middot; <a href="tree.html">Tree</a> &middot; <a href="rarest.html">Rarest</a></span>
        </div>

        <div class="control-group">
            <label for="observer"><strong>Observer: </strong></label>
            <input type="text" id="observer" value="observer_sydney" placeholder="iNat Username">
        </div>

        <div class="control-group">
            <label for="gridZoom"><strong>Grid Size (Native Zoom): </strong><span id="zoomVal">9</span></label>
            <!-- Lower native zoom = larger grid squares. Higher native zoom = smaller squares. -->
            <input type="range" id="gridZoom" min="5" max="14" value="9" step="1"
                   oninput="document.getElementById('zoomVal').innerText = this.value"
                   onchange="renderGrid()">
        </div>

        <button onclick="renderGrid()">Update Grid</button>

        <div class="control-group">
            <button id="trackBtn" onclick="toggleTracking()">📍 Track My Location</button>
            <span id="status"></span>
        </div>
    </div>

    <div id="map"></div>

    <script type="module" src="grid_viewer.js"></script>
</body>
</html>
