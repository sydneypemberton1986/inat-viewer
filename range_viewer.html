<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iNaturalist Range Map Viewer</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link rel="stylesheet" href="shared.css">
    <style>
        #ui-container { width: 280px; }
        #ui-container h1 { font-size: 1.05rem; margin: 0; }
        /* Autocomplete dropdown over the map; needs an opaque background to read. */
        .suggestions { list-style: none; margin: 3px 0 0; padding: 0; background: #fff;
                       border: 1px solid #ccc; border-radius: 4px; max-height: 300px; overflow-y: auto; }
        .suggestions li { display: flex; align-items: center; gap: 8px; padding: 5px 7px; cursor: pointer; }
        .suggestions li.active { background: #eee; }
        .suggestions img { width: 34px; height: 34px; object-fit: cover; flex-shrink: 0; }
        /* Legend rows: color swatch + thumbnail + drillable name on one line. */
        .legend-item { display: flex; align-items: center; gap: 7px; }
        .swatch { width: 15px; height: 15px; flex-shrink: 0; border-radius: 3px; }
        .legend-thumb { width: 26px; height: 26px; object-fit: cover; flex-shrink: 0; }
        .drill, .nondrill { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0;
                            background: none; border: 0; padding: 0; font: inherit; color: inherit;
                            text-align: left; cursor: pointer; }
        /* Stack the scientific/common names; put each filter on its own row. */
        .legend-name { display: flex; flex-direction: column; }
        .filter-row { display: flex; align-items: center; gap: 6px; }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="control-group page-nav">
            <span><a href="index.html">Home</a> &middot; <a href="grid_viewer.html">Map</a> &middot; <a href="rarest.html">Rarest</a></span>
        </div>

        <h1>🗺️ Range map by child taxon</h1>

        <div class="control-group">
            <label for="taxonInput"><strong>Taxon (name, ID, or iNat URL):</strong></label>
            <input type="text" id="taxonInput" value="Puma concolor" placeholder="e.g. Puma concolor, 42007, or a taxa URL"
                   autocomplete="off" oninput="onSearchInput()" onkeydown="onSearchKeydown(event)">
            <ul id="suggestions" class="suggestions" hidden></ul>
            <button onclick="loadFromInput()">Load</button>
        </div>

        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="taxon-title" id="taxonTitle"></div>

        <div class="control-group">
            <strong style="font-size:13px;">Data source</strong>
            <div class="mode-row">
                <label><input type="radio" name="mode" value="observations" checked onchange="setMode(this.value)"> Observations</label>
                <label><input type="radio" name="mode" value="range" onchange="setMode(this.value)"> Range polygons</label>
            </div>
        </div>

        <div class="note" id="modeNote"></div>

        <div class="control-group">
            <strong style="font-size:13px;">Observation filters</strong>
            <label class="filter-row"><input type="checkbox" id="wildOnly" onchange="setWildOnly(this.checked)"> Wild only (exclude captive/cultivated)</label>
            <label class="filter-row"><input type="checkbox" id="researchOnly" onchange="setResearchOnly(this.checked)"> Research grade only</label>
        </div>

        <div class="control-group">
            <label for="opacity"><strong>Overlay opacity: </strong><span id="opacityVal">65</span>%</label>
            <input type="range" id="opacity" min="10" max="100" value="65" step="5" oninput="setOpacity(this.value)">
        </div>

        <div id="legend"></div>

        <span id="status"></span>
    </div>

    <div id="map"></div>

    <script type="module" src="range_viewer.js"></script>
</body>
</html>
